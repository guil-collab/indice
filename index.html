<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GuilTeach — Aprende sobre el audio</title>
  <meta name="description" content="Colección de micrositios GuilTeach para aprender sobre el audio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;min-height:100vh;background:#f5f0e8 url('bg.jpg') center/cover fixed;display:flex;flex-direction:column;align-items:center;}
    .overlay{min-height:100vh;width:100%;background:rgba(245,240,232,0.55);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px 80px;}
    .wrapper{max-width:960px;width:100%;text-align:center;}
    h1{font-family:'Caveat',cursive;font-size:clamp(42px,8vw,64px);font-weight:700;color:#1a1a1a;letter-spacing:-1px;line-height:1.1;text-shadow:1px 2px 0 rgba(255,255,255,0.6);}
    .subtitle{font-size:clamp(14px,2.5vw,16px);color:#333;margin:10px 0 36px;font-weight:600;text-shadow:0 1px 4px rgba(255,255,255,0.8);}
    .folders{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;}
    .folder-btn{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;background:none;border:none;padding:8px;text-decoration:none;transition:transform .18s ease;-webkit-tap-highlight-color:transparent;}
    .folder-btn:hover,.folder-btn:focus{transform:translateY(-6px) scale(1.06);outline:none;}
    .folder-btn:active{transform:scale(0.96);}
    .folder-icon{width:clamp(90px,15vw,120px);height:auto;filter:drop-shadow(0 4px 10px rgba(60,110,180,0.25));}
    .folder-label{background:rgba(255,255,255,0.72);border-radius:10px;padding:5px 10px;backdrop-filter:blur(2px);font-family:'Caveat',cursive;font-size:clamp(18px,3.5vw,22px);font-weight:700;color:#111;text-align:center;max-width:140px;line-height:1.25;text-shadow:0 1px 4px rgba(255,255,255,0.85);}
    footer{position:fixed;bottom:0;width:100%;text-align:center;padding:12px;font-size:12px;color:#444;font-weight:600;background:rgba(245,240,232,0.75);backdrop-filter:blur(4px);}

    /* ── Modal centrado ── */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;padding:16px;}
    .modal-overlay.open{display:flex;animation:fadeIn .2s ease;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal-panel{background:#fff;border-radius:20px;width:100%;max-width:660px;max-height:88vh;overflow-y:auto;padding:28px 24px 36px;animation:popIn .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 20px 60px rgba(0,0,0,0.25);}
    @keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
    .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1.5px solid #eef2f8;}
    .modal-title{font-family:'Caveat',cursive;font-size:clamp(22px,5vw,30px);font-weight:700;color:#1a1a1a;}
    .modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#aaa;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
    .modal-close:hover{background:#f0f0f0;color:#333;}
    .tool-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;list-style:none;}
    .tool-item a{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:#f5f8ff;border:1.5px solid #d0e0f8;border-radius:12px;text-decoration:none;color:#1a3a6e;font-size:14px;font-weight:600;transition:all .15s ease;gap:8px;-webkit-tap-highlight-color:transparent;}
    .tool-info{display:flex;flex-direction:column;gap:1px;}
    .tool-name{font-weight:600;}
    .tool-desc{font-size:11px;color:#5a7a9a;font-weight:400;line-height:1.3;opacity:0.9;}
    .tool-item a:hover,.tool-item a:focus{background:#e0edff;border-color:#5090e0;transform:translateY(-2px);box-shadow:0 4px 12px rgba(60,110,200,0.15);}
    .tool-item a:active{transform:scale(0.97);}
    .tool-item a .arrow{color:#5090e0;font-size:16px;flex-shrink:0;}

    /* ── Mobile ── */
    @media(max-width:500px){
      .overlay{padding:30px 12px 70px;}
      .folders{gap:16px;}
      .folder-btn{padding:4px;}
      .folder-icon{width:80px;}
      .folder-label{font-size:22px;max-width:140px;color:#000;font-weight:900;line-height:1.2;background:rgba(255,255,255,0.80);border-radius:10px;padding:5px 10px;}
      .modal-panel{padding:20px 16px 28px;border-radius:16px;}
      .tool-list{grid-template-columns:1fr 1fr;}
      .tool-item a{padding:11px 10px;font-size:13px;}
    }
    @media(max-width:340px){
      .folders{gap:10px;}
      .folder-icon{width:68px;}
      .tool-list{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="wrapper">
      <header>
        <h1>GuilTeach</h1>
        <p class="subtitle">Selecciona un área para explorar sus herramientas interactivas</p>
      </header>
      <div class="folders">
        <button class="folder-btn" onclick="openModal('acustica')">
          <svg class="folder-icon" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g1a" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#a8d8f0"/><stop offset="100%" style="stop-color:#6aafe0"/></linearGradient><linearGradient id="g1b" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#88c4ec"/><stop offset="100%" style="stop-color:#4e96cc"/></linearGradient></defs><path d="M5 32 Q5 26 11 26 L44 26 Q48 26 50 22 L56 14 Q58 10 63 10 L109 10 Q115 10 115 16 L115 32 Z" fill="url(#g1a)" stroke="#4080b0" stroke-width="1.5"/><rect x="5" y="30" width="110" height="64" rx="7" fill="url(#g1b)" stroke="#4080b0" stroke-width="1.5"/><rect x="5" y="30" width="110" height="64" rx="7" fill="rgba(255,255,255,0.13)"/></svg>
          <span class="folder-label">Acústica Arquitectónica</span>
        </button>
        <button class="folder-btn" onclick="openModal('ajustes')">
          <svg class="folder-icon" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g2a" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#a8d8f0"/><stop offset="100%" style="stop-color:#6aafe0"/></linearGradient><linearGradient id="g2b" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#88c4ec"/><stop offset="100%" style="stop-color:#4e96cc"/></linearGradient></defs><path d="M5 32 Q5 26 11 26 L44 26 Q48 26 50 22 L56 14 Q58 10 63 10 L109 10 Q115 10 115 16 L115 32 Z" fill="url(#g2a)" stroke="#4080b0" stroke-width="1.5"/><rect x="5" y="30" width="110" height="64" rx="7" fill="url(#g2b)" stroke="#4080b0" stroke-width="1.5"/><rect x="5" y="30" width="110" height="64" rx="7" fill="rgba(255,255,255,0.13)"/></svg>
          <span class="folder-label">Ajuste y Calibración de Equipos de Audio</span>
        </button>
        <button class="folder-btn" onclick="openModal('fundamentos')">
          <svg class="folder-icon" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g3a" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#a8d8f0"/><stop offset="100%" style="stop-color:#6aafe0"/></linearGradient><linearGradient id="g3b" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#88c4ec"/><stop offset="100%" style="stop-color:#4e96cc"/></linearGradient></defs><path d="M5 32 Q5 26 11 26 L44 26 Q48 26 50 22 L56 14 Q58 10 63 10 L109 10 Q115 10 115 16 L115 32 Z" fill="url(#g3a)" stroke="#4080b0" stroke-width="1.5"/><rect x="5" y="30" width="110" height="64" rx="7" fill="url(#g3b)" stroke="#4080b0" stroke-width="1.5"/><rect x="5" y="30" width="110" height="64" rx="7" fill="rgba(255,255,255,0.13)"/></svg>
          <span class="folder-label">Fundamentos y Física del Sonido</span>
        </button>
        <button class="folder-btn" onclick="openModal('djs')">
          <svg class="folder-icon" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g4a" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#a8d8f0"/><stop offset="100%" style="stop-color:#6aafe0"/></linearGradient><linearGradient id="g4b" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#88c4ec"/><stop offset="100%" style="stop-color:#4e96cc"/></linearGradient></defs><path d="M5 32 Q5 26 11 26 L44 26 Q48 26 50 22 L56 14 Q58 10 63 10 L109 10 Q115 10 115 16 L115 32 Z" fill="url(#g4a)" stroke="#4080b0" stroke-width="1.5"/><rect x="5" y="30" width="110" height="64" rx="7" fill="url(#g4b)" stroke="#4080b0" stroke-width="1.5"/><rect x="5" y="30" width="110" height="64" rx="7" fill="rgba(255,255,255,0.13)"/></svg>
          <span class="folder-label">Herramientas para DJ's
        </button>
        <button class="folder-btn" onclick="openModal('instalaciones')">
          <svg class="folder-icon" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g5a" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#a8d8f0"/><stop offset="100%" style="stop-color:#6aafe0"/></linearGradient><linearGradient id="g5b" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#88c4ec"/><stop offset="100%" style="stop-color:#4e96cc"/></linearGradient></defs><path d="M5 32 Q5 26 11 26 L44 26 Q48 26 50 22 L56 14 Q58 10 63 10 L109 10 Q115 10 115 16 L115 32 Z" fill="url(#g5a)" stroke="#4080b0" stroke-width="1.5"/><rect x="5" y="30" width="110" height="64" rx="7" fill="url(#g5b)" stroke="#4080b0" stroke-width="1.5"/><rect x="5" y="30" width="110" height="64" rx="7" fill="rgba(255,255,255,0.13)"/></svg>
          <span class="folder-label">Instalaciones de Equipos de Sonido</span>
        </button>
      </div>
    </div>
  </div>
  <footer>© <span id="yr"></span> GuilTeach — Aprende sobre el audio</footer>
  <div class="modal-overlay" id="modalOverlay" onclick="closeOnBg(event)">
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle"></span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <ul class="tool-list" id="toolList"></ul>
    </div>
  </div>
  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
    const BASE = 'https://guil-collab.github.io/web-guilteach';
    const CATS = {
      acustica:{label:'Acústica Arquitectónica',folder:'Acústica Arquitectónica',tools:[
        {file:'Curvas NC y NR',name:'Curvas NC y NR',desc:'Evalúa el nivel de ruido de fondo de un espacio'},
        {file:'Modos de Resonancia',name:'Modos de Resonancia',desc:'Calcula frecuencias resonantes de una sala rectangular'}
      ]},
      ajustes:{label:'Ajuste y Calibración de Equipos de Audio',folder:'Ajustes de Equipos de Sonido',tools:[
        {file:'Configuraciones de Subwoofer',name:'Configuraciones de Subwoofer',desc:'Compara distintas disposiciones de subwoofers'},
        {file:'Crossovers',name:'Crossovers',desc:'Simula filtros de cruce entre graves y agudos'},
        {file:'curva de fase I',name:'Curva de Fase — Parte I',desc:'Análisis de fase en función de la frecuencia'},
        {file:'Curva de Fase II',name:'Curva de Fase — Parte II',desc:'Visualiza la curva de fase de un sistema completo'},
        {file:'Filtro Peine',name:'Filtro Peine',desc:'Efecto de cancelación por reflexión tardía'},
        {file:'Ordenes de Filtros',name:'Órdenes de Filtros',desc:'Compara filtros por pendiente y orden'},
        {file:'Suma de dos Fuentes identicas',name:'Suma de dos Fuentes Idénticas',desc:'Interacción entre dos fuentes de sonido iguales'},
        {file:'Tabla Desfase por Delay',name:'Tabla Desfase por Delay',desc:'Desfase en grados según tiempo de retardo'}
      ]},
      fundamentos:{label:'Fundamentos y Física del Sonido',folder:'Fundamentos del sonido',tools:[
        {file:'Atomo y Movimiendo armónico Simple',name:'Átomo y Movimiento Armónico Simple',desc:'MAS: la base del movimiento oscilatorio'},
        {file:'Atomos y Onda I',name:'Átomos y Onda — Parte I',desc:'Vibración atómica y propagación de onda'},
        {file:'Atomos y Onda II',name:'Átomos y Onda — Parte II',desc:'Vibración atómica y propagación de onda (versión ampliada)'},
        {file:'Fase y Grados ',name:'Fase y Grados',desc:'Relación visual entre fase y grados de una onda'},
        {file:'Onda 2 Armónicos',name:'Síntesis con 2 Armónicos',desc:'Superposición de dos componentes armónicos'},
        {file:'Onda 3 Armónicos',name:'Síntesis con 3 Armónicos',desc:'Superposición de tres componentes armónicos'},
        {file:'Visualizador de Desfases',name:'Visualizador de Desfases',desc:'Efecto visual del desfase entre dos ondas'}
      ]},
      djs:{label:"Herramientas para DJ's",folder:'Herramientas para DJ´s',tools:[
        {file:'Asistente para Pinchar Con Vinilo',name:'Asistente para Pinchar con Vinilo',desc:'Herramienta para sincronizar con vinilo analógico'},
        {file:'Calculadora Transpoción de Samples',name:'Calculadora de Transposición de Samples',desc:'Transpone samples según el ajuste de pitch'},
        {file:'Rueda de Camelot',name:'Rueda de Camelot',desc:'Compatibilidad de tonalidades para mezclas armónicas'}
      ]},
      instalaciones:{label:'Instalaciones de Equipos de Sonido',folder:'Instalaciones de Equipos de Sonido',tools:[
        {file:'Ejercicios de Amplificar de Potencia',name:'Cálculos de Amplificación de Potencia',desc:'Dimensiona amplificadores según la carga'}
      ]}
    };
    function openModal(id){
      const cat=CATS[id];
      document.getElementById('modalTitle').textContent=cat.label;
      document.getElementById('toolList').innerHTML=cat.tools.map(t=>{
        const url=BASE+'/'+encodeURIComponent(cat.folder)+'/'+encodeURIComponent(t.file)+'.html';
        return '<li class="tool-item"><a href="'+url+'" target="_self"><div class="tool-info"><span class="tool-name">'+t.name+'</span>'+(t.desc?'<span class="tool-desc">'+t.desc+'</span>':'')+'</div><span class="arrow">↗</span></a></li>';
      }).join('');
      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow='hidden';
    }
    function closeModal(){document.getElementById('modalOverlay').classList.remove('open');document.body.style.overflow='';}
    function closeOnBg(e){if(e.target===document.getElementById('modalOverlay'))closeModal();}
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  </script>
</body>
</html>
